version: '3.8'

services:
  # 1. Your .NET Web API Backend
  backend:
    image: gymworkout-backend
    build:
      context: .
      dockerfile: GymWorkout/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  # 2. Your Vite Frontend Client
  frontend:
    image: gymworkout-frontend
    build:
      context: ../Client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      # ADD THIS LINE HERE so your React code can read the backend URL
      - VITE_API_URL=http://localhost:5000  
    depends_on:
      - backend